<style>
:root { --bg: #f6f3ee; --card: #fffdf9; --ink: #141c2b; --muted: #667085; --rule: #e3ded4; --hero: #c8102e; --navy: #13284a; --gold: #c9921a; --chip: #ece7de; --fs: 18px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f141c; --card: #171e29; --ink: #e8e4dc; --muted: #9aa3b2; --rule: #2a3342; --chip: #222b38; --navy: #8fb2ff; } }
:root[data-theme="dark"] { --bg: #0f141c; --card: #171e29; --ink: #e8e4dc; --muted: #9aa3b2; --rule: #2a3342; --chip: #222b38; --navy: #8fb2ff; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: 'Noto Sans TC', sans-serif; font-size: var(--fs); line-height: 1.75; }
header { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
.bar { max-width: 1080px; margin: 0 auto; padding: 12px 16px 10px; display: flex; flex-direction: column; gap: 10px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font: 700 21px/1.3 'Noto Serif TC', serif; color: var(--navy); }
h1 small { font: 500 14px 'Noto Sans TC', sans-serif; color: var(--muted); margin-left: 8px; }
.links a { font-size: 14px; color: var(--hero); text-decoration: none; margin-left: 12px; white-space: nowrap; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { border: 1px solid var(--rule); background: var(--chip); color: var(--ink); border-radius: 999px; padding: 6px 14px; font: 500 15px 'Noto Sans TC', sans-serif; cursor: pointer; }
.chip b { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 13px; color: var(--muted); margin-left: 6px; }
.chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.chip.on b { color: rgba(255,255,255,.75); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: var(--card); color: var(--ink); padding: 6px 16px; font: 500 15px 'Noto Sans TC', sans-serif; cursor: pointer; }
.seg button.on { background: var(--hero); color: #fff; }
.tools { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.tools button { border: 1px solid var(--rule); background: var(--card); color: var(--ink); border-radius: 8px; padding: 4px 10px; font-size: 14px; cursor: pointer; }
.tools label { font-size: 14px; color: var(--muted); display: flex; gap: 4px; align-items: center; cursor: pointer; }
main { max-width: 1080px; margin: 0 auto; padding: 18px 16px 80px; }
.person { margin-bottom: 40px; }
.phead { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; border-bottom: 3px solid var(--navy); padding-bottom: 6px; margin-bottom: 16px; }
.phead h2 { font: 700 24px 'Noto Serif TC', serif; }
.phead h2 span { color: var(--hero); margin-right: 8px; }
.phead .meta { font-size: 14px; color: var(--muted); }
.page { display: grid; grid-template-columns: 300px 1fr; gap: 20px; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
.page.nothumb { grid-template-columns: 1fr; }
.page.nothumb .thumb { display: none; }
.thumb img { width: 100%; border-radius: 6px; border: 1px solid var(--rule); display: block; }
.thumb a { font-size: 13px; color: var(--hero); text-decoration: none; }
.ptitle { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.num { font: 500 13px 'JetBrains Mono', monospace; background: var(--hero); color: #fff; border-radius: 6px; padding: 1px 8px; }
.ptitle h3 { font: 700 19px 'Noto Sans TC', sans-serif; }
.text { text-wrap: pretty; }
.opt { color: var(--muted); font-style: italic; }
.opt::before { content: '可省略 '; font-style: normal; font-size: 12px; border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; margin-right: 4px; }
.key { font-size: calc(var(--fs) * 1.12); font-weight: 500; border-left: 4px solid var(--gold); padding-left: 12px; }
.extra { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 18px; margin-top: 4px; }
.extra summary { cursor: pointer; font-weight: 700; color: var(--navy); }
.extra ul { margin: 10px 0 4px 22px; }
.qa { margin-top: 12px; }
.qa .q { font-weight: 700; }
.qa .hard { font: 700 12px 'JetBrains Mono', monospace; color: #fff; background: var(--hero); border-radius: 4px; padding: 1px 6px; margin-right: 6px; }
.qa .a { margin: 2px 0 10px; color: var(--ink); }
.foot { color: var(--muted); font-size: 13px; margin-top: 30px; text-align: center; }
@media (max-width: 760px) {
  header { position: static; }
  .page { grid-template-columns: 1fr; gap: 10px; padding: 12px; }
  .tools { margin-left: 0; }
  h1 small { display: block; margin: 2px 0 0; }
}

<script>
const PEOPLE = [{"name": "陳羽丞", "part": "開場＋Part I 期貨為什麼便宜", "slides": "第 1–5 頁", "mins": [3.8, 3.6], "pages": [{"n": 1, "title": "封面", "text": "大家好，我們是第 8 組，題目是期貨交易策略分析。我們的策略一句話講完：用台指期取代現貨來持有台股，而且只在期貨便宜的時候這樣做。封面這個 7.6 億，是假設 2008 年初投入 1 億，到今年 10 月，期末比含息大盤多出來的財富，已經扣掉所有交易成本。換算成年化，大約每年多 2.8%，19 年裡有 16 年贏大盤。", "key": "開場：一句話講策略——期貨便宜時用「台指期＋現金」取代現貨持有台股。7.6 億＝1 億從 2008 年起，期末比含息大盤多賺的錢。"}, {"n": 2, "title": "先講答案", "text": "先講結論，四個問題。第一，錢從哪裡來？從避險者付給期貨多方的折價。第二，多賺多少？每年 2.83%，用 bootstrap 抽樣，90% 的信賴區間是 1.84% 到 4.39%，不包含 0。第三，會不會失效？會，而且正在發生：2021 年以後的測試期，超額只剩 0.60%。第四，我們的決策：核心規則通過，進入模擬交易；我們另外試了一個加強版，每年只多 0.02%，還要借錢，所以不採用。[[這頁所有的超額，都是相對「含息」的加權報酬指數，不是價格指數。]]", "key": "先給四個答案：錢從避險者付的折價來；每年多 +2.83%；優勢正在衰退（測試期只剩 +0.60%）；核心規則通過 → 模擬交易。"}, {"n": 3, "title": "Part I 分隔頁", "text": "第一部分，先回答期貨為什麼會便宜。這個 57% 的意思是：2008 年到現在，有 57% 的交易日，台指期的價格比理論上的合理價還低；反過來比較貴的日子，只有 15%。", "key": "Part I 分隔頁：要回答「期貨為什麼便宜」。57% 的交易日期貨比合理價便宜，偏貴只有 15%。"}, {"n": 4, "title": "合理價與拆解", "text": "什麼叫合理價？持有現貨可以領股利；持有期貨不領股利，但不用把錢全部拿去買股票，剩下的現金可以放定存。兩邊打平的價格就是合理價。我們的基差用主流定義，現貨減期貨，正的代表期貨比現貨便宜。「便宜程度」就是這個 mis 公式：基差加上利息、減掉預期股利，大於 0 就是期貨比合理價便宜。左邊這張圖是一直持有近月期貨的帳：基差每年平均 5.55%，也就是買在比現貨低 5.55% 的地方，加上現金利息 1.40%，扣掉放棄的股利 3.58%，再扣時間差雜訊 0.50%，淨賺 2.87%。重點在右下角：偏離主要出現在「非除息月份」，每個月 0.30%，除息季反而只有 0.12%。也就是說，這個折價不是股利能解釋的。", "key": "解釋合理價與便宜程度：mis＝基差（S−F）/S＋利息−股利。一直持有期貨每年：基差 +5.55%＋利息 1.40%−股利 3.58%−雜訊 0.50%＝+2.87%，而且偏離主要在非除息月。"}, {"n": 5, "title": "避險壓力", "text": "那是誰把期貨壓低？上面是三大法人的台指期淨部位，下面是扣掉股利和利息之後的期貨溢價，紅色代表期貨偏貴、綠色代表便宜。2018 到 2020 年，投信每年平均淨空大約 2.5 到 3 萬口，主要是基金在避險，那段時間幾乎都是綠的。2024 年開始，投信轉成淨多單，今年平均已經到 5.4 萬口，就開始變紅。兩者的相關係數大約 0.6。[[外資剛好站在對面，相關係數是負 0.52。]]這就是 Keynes 講的避險壓力：避險的人付錢，接手的人賺溢酬。接下來由杉彬說明，為什麼沒有人把這個折價套利掉。", "key": "誰把期貨壓低？投信由淨空（避險）轉成淨多，期貨溢價跟著由綠轉紅（相關 +0.61）→ 避險壓力假說。"}], "numbers": ["7.6 億＝1 億的期末財富差（18.6 億 vs 11.0 億）；年化超額 +2.83%；19 年中 16 年贏", "bootstrap 90% 區間 [1.84%, 4.39%]；測試期 2021–2026 只剩 +0.60%", "便宜 57% 交易日 vs 偏貴 15%；持續 12.3 vs 7.1 天；下週同號 77% vs 51%", "偏離拆解：折價 +5.55%、利息 +1.40%、股利 −3.58%、雜訊 −0.50% ＝ +2.87%", "非除息月每月 +0.30% vs 除息季 +0.12%", "投信 2018–20 淨空約 2.5–3 萬口 → 2026 淨多 5.4 萬口；相關約 0.6（外資 −0.52）"], "qa": [{"q": "為什麼基準用報酬指數，不用加權指數？", "a": "期貨的價格已經扣掉股利，如果拿來跟不含息的價格指數比，股利那 3% 多會被算成期貨的超額，會高估。所以我們一律跟含息的報酬指數比。", "hard": false}, {"q": "你們的基差是哪個方向？", "a": "現貨減期貨，再除以現貨，這是 Hull 等教科書的主流定義。正的代表逆價差、期貨比現貨便宜。法人那幾頁的「期貨溢價」方向剛好相反，正的代表期貨偏貴，等於負的便宜程度，所以我們特別改了名字，避免混淆。", "hard": true}, {"q": "預期股利為什麼用去年同期的實際值？", "a": "因為它在換倉當下就知道，不會用到未來資訊。我們也測過「事後完全知道股利」的版本，超額只多 0.19%，代表猜錯股利的代價很小。", "hard": true}, {"q": "相關性 0.6 能證明是投信造成的嗎？", "a": "不能證明因果，只能說兩者同向。我們把它當成假說的佐證，而且法人資料只有 2018 年以後，樣本比較短，報告的限制有寫。", "hard": true}, {"q": "2008 年的放空限制是什麼？", "a": "2008 年金融海嘯期間，主管機關曾經全面限制放空，台灣 50 等 150 檔權值股的平盤以下放空限制到 2009 年 1 月 5 日才解除。套利者沒辦法做反向套利，所以那段時間期貨折價特別深，2008 年 11 月換倉時期貨比現貨低了 4.6%，也就是基差 4.6%。限制本身已經查證，但它和折價的因果關係是我們的推論。", "hard": true}]}, {"name": "黃杉彬", "part": "套利不對稱＋Part II 策略規格＋Part III 結果（上）", "slides": "第 6–10 頁", "mins": [4.1, 3.7], "pages": [{"n": 6, "title": "套利限制不對稱", "text": "接著回答一個問題：既然期貨便宜，為什麼沒有人套利把它拉回來？因為套利的難度不對稱。期貨便宜時，套利要放空現股、買期貨，受到借券成本和放空限制；期貨偏貴時，只要買現股、空期貨，門檻低很多。資料也支持：便宜的狀態平均持續 12.3 個交易日，偏貴只有 7.1 天；下一週還維持同方向的機率，便宜是 77%，偏貴只有 51%。[[頁尾有寫：如果改用月資料，半衰期的方向是相反的，但偏貴的樣本只有 72 個月，我們兩個都列出來。]]所以折價可以存在很久，這就是核心規則能賺錢的原因。接下來進入策略規則。", "key": "為什麼沒被套利掉：便宜時要放空現股，難；偏貴時買現股＋空期貨，容易。資料顯示便宜狀態更持久（12.3 vs 7.1 天、下週同號 77% vs 51%）。"}, {"n": 7, "title": "Part II 分隔頁", "text": "第二部分，策略規則。我們的策略其實只有一條規則，而且「沒有調參」。這個 0.12%，是切換門檻 θ，它是 ETF 買一次、賣一次單邊成本的平均：買進大約 0.073%，賣出因為有 0.1% 證交稅，大約 0.173%。它由成本決定，不是在資料上找出來的最佳值。", "key": "Part II 分隔頁：策略只有一條規則、沒有調參。θ＝0.12% 是 ETF 買賣單邊成本的平均，由成本決定。"}, {"n": 8, "title": "核心規則與加強版", "text": "核心規則只有一條：每個月結算日的前一天收盤後，算出 g，也就是每月期望超額：把便宜程度除以契約剩餘的月數，換算成每個月可以多賺多少。g 大於門檻 θ，也就是每月 0.12%，就用台指期加現金持有；g 小於負的門檻，就改持現貨；中間維持原狀，避免來回切換。永遠是 1 倍曝險，大台取整數、小台補零頭。為什麼前一天算、結算日才成交？因為期貨 13:45 收盤、現貨 13:30 收盤，同一天算同一天做，會因為這 15 分鐘產生假的相關。下面一列是我們試過的加強版：期貨偏貴時反過來做正價差套利。先說結論，它幾乎沒有多賺，等一下怡昇會說明原因。", "key": "核心規則：結算前一日算 g（每月期望超額），g＞θ 用期貨、g＜−θ 持現貨、中間不動。另外試了一個加強版（正價差套利）。"}, {"n": 9, "title": "累積財富", "text": "第三部分，結果。19 年裡我們做了 226 次月決策，總共切換 38 次，大約 77% 的月份持有期貨。這是 1 億的累積財富。紅線是核心規則，期末 18.6 億；黑色虛線是含息大盤，11.0 億。底下灰色的是幾次大跌：金融海嘯、2015 股災、COVID、2022 升息。可以看到核心規則的超額是一點一點累積的，不是靠某一次大賭。[[但核心規則的回撤跟大盤幾乎一樣，因為它永遠是 1 倍曝險，它只改變工具，不改變風險。]]右邊淡橘色是 2024 年以後投信轉淨多的期間。", "key": "Part III 結果：1 億 → 18.6 億，含息大盤 11.0 億；19 年 226 次決策、38 次切換、77% 的月份持有期貨。"}, {"n": 10, "title": "訊號有效嗎", "text": "訊號到底有沒有用？右邊這張最重要：我們把 226 次決策依照事前的便宜程度分成四組，下一期的超額是單調上升的，最貴的一組平均虧 0.12%，最便宜的一組賺 0.69%。左邊是累積超額：灰線是一直持有期貨，2024 年以後期貨變貴，灰線明顯往下掉；紅線是核心規則，因為它在期貨偏貴時改持現貨，大致守住了成果。這就是判斷工具的價值。接下來由怡昇說明，這個偏離理論上值多少、我們實際拿到多少。", "key": "訊號有效：事前 g 分四組，下一期超額由 −0.12% 單調升到 +0.69%（相關 0.66）；2024 年後期貨變貴，規則改持現貨守住成果。"}], "numbers": ["套利不對稱：便宜段平均 12.3 天 vs 偏貴 7.1 天；下週仍同號 77% vs 51%；半衰期 1.3 vs 0.5 週（月資料方向相反）", "切換門檻 θ＝0.12%／月＝ETF 單邊成本（買 0.073%、賣 0.173% 的平均）", "226 次決策、38 次切換、77% 月份持有期貨、總成本 2,785 萬", "1 億 → 核心規則 18.6 億、含息大盤 11.0 億（期末差 7.6 億）", "四組下一期超額：−0.12%、+0.16%、+0.25%、+0.69%（相關 0.66）", "核心規則年化 16.8% vs 大盤 13.6%；Sharpe 0.81 vs 0.71；最大回撤 −53.7% vs −53.6%"], "qa": [{"q": "門檻為什麼不調到最好的值？", "a": "調參就有過度配適的風險。我們測過 0% 到 0.5% 五組門檻，訓練期和測試期全部是正的，0.25% 甚至更好，但我們沒有換，因為那是看過結果才知道的。", "hard": true}, {"q": "套利不對稱的月資料結果相反，怎麼解釋？", "a": "週資料是便宜的狀態收斂比較慢，符合假說；月資料的半衰期方向相反，但偏貴的樣本只有 72 個月、t 值 −2.5，比較不可靠。所以主要看比較穩健的「持續機率」，兩種頻率都是便宜的狀態比較持久（77% vs 51%、81% vs 61%）。", "hard": true}, {"q": "為什麼只用近月契約，不挑最便宜的契約？", "a": "我們試過在近月、次月、季月裡挑最便宜的，結果反而比較差（2.09% vs 2.37%，以 0050 為基準），所以不採用，報告附錄有列。", "hard": true}, {"q": "1 億要買幾口？", "a": "以現在指數 46,888 點，一口大台名目約 938 萬，1 億大約 10.7 口，10 口大台加 3 口小台。淨值成長到 18.6 億時最多 198 口，只占日均成交量 0.2%。", "hard": false}]}, {"name": "陳怡昇", "part": "侵蝕歸因＋加強版＋優勢在變弱＋門檻檢驗", "slides": "第 11–15 頁", "mins": [4.5, 4.3], "pages": [{"n": 11, "title": "侵蝕瀑布", "text": "這頁回答：期貨的定價偏離理論上值多少，我們實際拿到多少。最左邊 4.36%，是完美預知的上限，也就是事後知道每一期期貨會不會贏。往右一步一步扣：最大的一塊是負 0.71%，來自換倉後基差的變動和結算雜訊，這是無法預測的；用去年股利猜今年，扣 0.19%；期貨帳戶要留 20% 的安全現金、沒有利息，扣 0.22%；期貨的稅、手續費、滑價扣 0.16%；賣 ETF 的 0.1% 證交稅加其他成本，扣 0.25%。最後實際拿到 2.83%。[[中間那條橘色虛線是一直持有期貨、不計成本的 3.08%。]]能控制的損失主要是現貨切換成本和緩衝現金，合計大約 0.47%。", "key": "理論值多少、實際拿多少：完美預知 4.36% 一路扣到實際 2.83%；最大的侵蝕是無法預測的 −0.71%。"}, {"n": 12, "title": "加強版沒贏", "text": "我們也試著讓它更好，做了一個加強版：正價差套利。既然 2024 年以後期貨變貴，就反過來做，借錢多買現貨、同時空台指期，部位依偏貴程度調整，最多 30%。結果全期每年只多 0.02%。為什麼這麼少？第一，機會太少：226 個月裡只有 33 個月有機會，其中 16 個月在 2024 到 2026 年，有機會時平均也只用 20% 的資金。第二，它只在正價差期有用：2024 年以後每年多 0.45%，但 2008 到 2016 年反而少 0.11%。第三，要借錢：融資利差到 2% 就轉負，急漲時最壞 5 個交易日要補 3.5% 的現金。[[而且外資的淨部位和期貨溢價相關是負 0.52，代表外資早就在做這件事。]]所以我們不採用。", "key": "加強版（期貨偏貴時借錢買現貨、空期貨）沒贏：全期只多 +0.02%；機會少（33／226 個月）、只在正價差期有用、融資利差 2% 就轉負。"}, {"n": 13, "title": "Part IV 分隔頁", "text": "最後一部分：這個策略能不能上線？我們照作業 2 的可行性評估規格訂了 9 項門檻，核心規則 9 項全過。不過在看門檻之前，先看它的弱點。", "key": "Part IV 分隔頁：能不能上線？核心規則通過 9／9 門檻——但先看它的弱點。"}, {"n": 14, "title": "核心規則在變弱", "text": "這張圖的長條，是期貨本身的定價優勢，也就是一直持有期貨、不計成本，每年贏含息大盤多少。2008 到 2016 年平均每年 5.44%，2017 到 2026 年剩 0.95%，2024 到 2026 年變成負 2.65%，紅色變綠色。黃線是投信的台指期淨部位，從 2018 年才開始畫，因為法人期貨部位的公開資料只到 2018 年 6 月。2019 年淨空 2.5 萬口，今年淨多 5.4 萬口。投信從避險的空方變成建立部位的多方，期貨就不再便宜了。核心規則之所以還能守住，是因為它在期貨偏貴時會改持現貨，但已經賺不多。這是我們最主要的風險，也是停用條件的依據。接下來看門檻檢驗。", "key": "核心規則在變弱：期貨本身的優勢由每年 +5.44% 掉到 −2.65%；投信由淨空 2.5 萬口轉為淨多 5.4 萬口。規則靠改持現貨自保。"}, {"n": 15, "title": "門檻表", "text": "這是 9 項門檻。核心規則全部通過：測試期超額為正，0.60%；Sharpe 1.18，高於大盤 1.17；成本加倍還有 2.42%；訊號晚一天還有 2.99%；84% 的年份贏大盤；bootstrap 下限 1.84%；資訊比率 1.01，在我們嘗試過 50 組策略的情況下，Deflated Sharpe 還有 0.997；容量也沒問題。其中最勉強的是測試期淨報酬，只剩 0.60%。要誠實說明：規則和參數在測試前就固定了，但這些數值門檻是 10 月 22 日才寫下的，屬於事後訂定，報告有揭露。接下來由柏寬說明成本、穩健性和最後的決策。", "key": "門檻表：核心規則 9 項全過（IR 1.01、Deflated Sharpe 0.997），最勉強的是測試期只剩 +0.60%；數值門檻是事後訂定，已揭露。"}], "numbers": ["瀑布：4.36 → −0.71 → −0.19 → −0.22 → −0.16 → −0.25 → 2.83%；可控損失約 0.47%", "加強版：全期 +0.02%（2024–26 +0.45%、2008–16 −0.11%）；33／226 個月；平均部位 20%；利差 2% 轉負（−0.011 個百分點）；最壞 5 日補現金 3.5%", "期貨本身定價優勢：2008–16 +5.44%／年、2017–26 +0.95%、2024–26 −2.65%", "投信淨部位：2019 −2.5 萬口 → 2026 +5.4 萬口", "9／9 門檻（核心規則）；最勉強的是測試期 +0.60%", "Deflated Sharpe 0.997（嘗試 50 組）；年度勝率 84%；容量 198 口＝日均量 0.2%"], "qa": [{"q": "為什麼不借錢做套利就不行？", "a": "核心規則在期貨偏貴時已經 100% 持有現貨，這時空期貨，淨曝險會從 1 倍降到 0.7 倍，等於放棄 30% 部位的股票溢酬，一年大約 7% 到 8%，用每月零點幾的套利去換不划算，全期反而少 1.06%。", "hard": true}, {"q": "加強版門檻也全過，為什麼不採用？", "a": "它過門檻是因為核心規則本身就過了，加強版只是在上面多 0.02%，1 億 19 年只多 600 萬。為了這 0.02% 要開融資、承擔急漲時補錢的風險，而且融資利差到 2% 就變成虧錢，不值得。", "hard": false}, {"q": "加強版是怎麼算的？", "a": "跟核心規則用同一個回測引擎：核心規則的每日報酬，再加上套利部位的權重乘以「報酬指數減期貨、減現金利息、減融資利差」，最後扣掉 ETF 買賣和期貨換倉成本。所以兩者可以直接比較。", "hard": true}, {"q": "黃線為什麼 2018 年才開始？", "a": "期交所的法人資料下載只提供近 3 年，我們用的 FinMind 從 2018 年 6 月開始，更早的公開資料取不到。所以 2008 到 2017 年的折價，我們只能說存在，不能說是投信造成的，報告的限制有寫。", "hard": true}, {"q": "期貨變貴，一定是投信造成的嗎？", "a": "不能證明因果，只能說同時發生、相關約 0.6。合理的解釋是 ETF 和基金用期貨建立多頭部位，需求變多就把價格推高。", "hard": true}, {"q": "門檻是看過結果才訂的，這樣不就沒意義？", "a": "我們承認這點並寫在報告裡。為了降低主觀性，門檻方向直接採用作業 2 的示例，例如淨報酬為正、成本加倍仍為正，沒有為結果量身調整。而且規則和參數在測試前就固定了。", "hard": true}, {"q": "Deflated Sharpe 是什麼？", "a": "我們嘗試了大約 50 組策略，挑最好的那一個本身就有運氣成分。Deflated Sharpe 會依嘗試次數提高門檻，再算出「真的比運氣好」的機率，核心規則是 0.997。它跟資訊比率不一樣：資訊比率 1.01 是績效本身（年化超額除以追蹤誤差），0.997 是這個績效不是運氣的機率。", "hard": true}]}, {"name": "陳柏寬", "part": "成本組成＋穩健性＋決策＋結論", "slides": "第 16–20 頁", "mins": [4.4, 3.8], "pages": [{"n": 16, "title": "成本組成", "text": "我先把成本拆開。從零成本的理想版一項一項加進去，每年總共吃掉 0.63%，從 3.47% 扣到 2.83%。最大的一塊不是付出去的錢，而是緩衝現金：期貨帳戶要留名目 20% 當保證金和安全墊，這筆錢沒有利息，每年少賺 0.22%。第二是 ETF 換手，每年 0.25%，其中證交稅 0.10%、手續費 0.09%、滑價 0.06%，19 年切換 38 次。期貨本身很便宜，每口大台每一邊大約 438 元，每月換倉一次約 625 元，合計每年 0.16%，其中滑價最大。[[期貨成本平均 0.16%，比用今天價格算的 0.08% 高，是因為手續費和滑價是固定金額，早年指數只有五千到九千點，占比比較高。]]", "key": "成本組成：每年共 0.63%＝緩衝現金不計息 0.22%＋ETF 換手 0.25%＋期貨 0.16%；期貨每口每邊約 438 元。"}, {"n": 17, "title": "穩健性", "text": "再看成本加倍會怎樣。左邊是核心規則在各種情境下的年化超額：基準成本 2.83%、成本 1.5 倍 2.62%、成本 2 倍 2.42%、晚一天執行 2.99%，都不崩。右邊上面是全期的 90% 信賴區間，1.84% 到 4.39%，不包含 0。訓練期 2008 到 2020 年是 3.83%，但測試期只剩 0.60%，90% 區間是負 0.34% 到正 1.45%，跨過 0。這和怡昇剛才講的一致：優勢還在，但變小了，單看最近 6 年不顯著。", "key": "穩健性：成本 2 倍仍 +2.42%、晚一天執行 +2.99%，都不崩；但測試期只剩 +0.60%（90% 區間跨 0）＝優勢變小。"}, {"n": 18, "title": "風險報酬比較", "text": "這頁把三個版本放在一起比。橫軸是最大回撤，縱軸是年化報酬。三個點的回撤都在負 54% 左右，因為都是 1 倍曝險。核心規則年化 16.8%，比含息大盤的 13.6% 每年多 3.2%，1 億期末 18.6 億，大盤是 11.0 億。空心圓是核心規則再加上加強版，幾乎和核心規則重疊，19 年只多 600 萬元。[[也就是說，風險一樣，報酬更高的來源是核心規則，不是加強版。]]", "key": "三點比較：回撤都約 −54%；核心規則每年比大盤多 3.2%（18.6 億 vs 11.0 億），加上加強版只再多 600 萬，兩點幾乎重疊。"}, {"n": 19, "title": "決策", "text": "最後是決策：只上線核心規則。2026 年 11 月到明年 4 月做 6 個月的模擬交易，每月記錄訊號、成交價和追蹤誤差。加強版調整後都沒贏過核心規則，每年只多 0.02%，借錢的成本又太高，所以不採用，只在正價差期再評估。停用條件我們寫成可以量化檢查的三條。第一，檢討假說：投信淨部位的 12 個月平均由負轉正，這個條件 2024 年就已經觸發了，剛才第 14 頁就是這次檢討，結論是規則能自保、但不再賺錢，所以我們只做模擬交易。第二，停止維運：連續 12 次決策都沒有轉進期貨就停，目前最近 12 次有 2 次持有期貨，還沒觸發。第三，優勢恢復：投信轉回淨空、或連續 3 個月期貨便宜，就恢復正常運作。[[補充：如果是個人投資人，現貨的股利要課稅，期貨交易所得停徵，把稅考慮進去，超額會升到 3.80%。]]", "key": "決策：只上線核心規則做 6 個月模擬交易；加強版不採用；檢討假說條件已觸發、停止維運未觸發，並說明優勢恢復條件。"}, {"n": 20, "title": "結論", "text": "總結一句話：期貨便宜的時候，就買便宜的那一個；但這個折價正在消失。我們找到一條有效的規則，也試過讓它更好但沒有成功，而且清楚知道它什麼時候會失效。限制寫在這頁：測試期不顯著、現金利率用重貼現率近似、法人資料只有 2018 年以後。以上是第 8 組的報告，謝謝大家，歡迎提問。", "key": "結論一句話：期貨便宜就買便宜的那一個，但折價正在消失；列出三個限制，謝謝並開放提問。"}], "numbers": ["成本每年 0.63%（3.47% → 2.83%）：緩衝現金 0.22%、ETF 換手 0.25%（證交稅 0.10／手續費 0.09／滑價 0.06）、期貨 0.16%（稅 0.04／手續費 0.03／滑價 0.09）", "每口大台每邊約 438 元（稅 188＋手續費 50＋滑價 200），每月換倉約 625 元", "測試期：核心規則 +0.60%（90% 區間 −0.34% ～ +1.45%）、核心＋加強版 +0.85%；訓練期 +3.83%", "成本 1.5 倍 +2.62%、2 倍 +2.42%、延遲 1 日 +2.99%", "三點比較：核心規則 16.8%／−53.7%／18.6 億；核心＋加強版 16.8%／−53.7%／18.7 億；含息大盤 13.6%／−53.6%／11.0 億", "個人稅後超額 +3.80%；模擬交易 2026/11–2027/04"], "qa": [{"q": "緩衝現金不計息也算成本嗎？", "a": "它不是付出去的錢，是機會成本：期貨帳戶要留名目 20% 當保證金和安全墊，這筆錢放定存本來會有利息。如果改用貨幣市場基金或用持股抵繳保證金，可以把這 0.22% 拿回一部分。", "hard": true}, {"q": "投信淨多單要擴大到多少才停？", "a": "我們不用「擴大到多少」，改用方向：投信淨部位的 12 個月平均由負轉正就檢討假說，這在 2024 年已經觸發；真正停止維運的條件是連續 12 次決策都沒轉進期貨，目前還沒觸發。這樣兩個條件都能量化檢查。", "hard": true}, {"q": "測試期不顯著，為什麼還說通過？", "a": "因為 9 項門檻都過，而且全期在多重檢定後仍顯著。測試期變弱有清楚的原因：投信轉淨多讓折價消失。所以我們的結論是進入模擬交易、搭配停用條件，而不是直接實盤。", "hard": true}, {"q": "如果現貨用 0050，結果會怎樣？", "a": "全期超額大約 2.07%，但測試期是負 1.17%。原因是 0050 和加權指數不一樣，台積電權重比較高，2017 年以後每年多贏加權指數 1.5% 到 1.9%，這是指數差，不是期貨定價。", "hard": false}]}];

let mode = q.get('mode') || store.get('mode') || 'full';
let fs = +(store.get('fs') || 18);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const fmtText = t => esc(t).replace(/\[\[(.+?)\]\]/g, '<span class="opt">$1</span>');

function chips() {
  const box = document.getElementById('who');
  const all = [['all', '全部', '1–20']].concat(PEOPLE.map(p => [p.name, p.name, p.slides.replace(/第 | 頁/g, '')]));
  box.innerHTML = all.map(([k, n, r]) => `<button class="chip${who === k ? ' on' : ''}" data-k="${k}">${n}<b>${r}</b></button>`).join('');
  box.querySelectorAll('.chip').forEach(b => b.onclick = () => { who = b.dataset.k; render(); });
  document.querySelectorAll('#mode button').forEach(b => { b.classList.toggle('on', b.dataset.m === mode); b.onclick = () => { mode = b.dataset.m; render(); }; });
}
function render() {
  store.set('who', who); store.set('mode', mode);
  history.replaceState(null, '', '#who=' + encodeURIComponent(who) + '&mode=' + mode);
  chips();
  const showThumb = document.getElementById('thumb').checked, hideOpt = document.getElementById('hideopt').checked;
  const list = who === 'all' ? PEOPLE : PEOPLE.filter(p => p.name === who);
  document.getElementById('main').innerHTML = list.map((p, i) => {
    const idx = PEOPLE.indexOf(p) + 1;
    const pages = p.pages.map(pg => `
      <article class="page${showThumb ? '' : ' nothumb'}">
        <div class="thumb"><img src="thumbs/s${String(pg.n).padStart(2, '0')}.jpg" alt="第 ${pg.n} 頁簡報" loading="lazy">
          <a href="index.html#s=${pg.n}" target="_blank">開啟這一頁簡報 ↗</a></div>
        <div><div class="ptitle"><span class="num">P${pg.n}</span><h3>${esc(pg.title)}</h3></div>
          ${mode === 'key' ? `<p class="key">${esc(pg.key)}</p>` : `<p class="text">${hideOpt ? esc(pg.text.replace(/\[\[(.+?)\]\]/g, '')) : fmtText(pg.text)}</p>`}</div>
      </article>`).join('');
    const extra = `
      <details class="extra"><summary>必背數字與可能被問的問題（${p.qa.length} 題）</summary>
        <ul>${p.numbers.map(n => `<li>${esc(n)}</li>`).join('')}</ul>
        <div class="qa">${p.qa.map(x => `<p class="q">${x.hard ? '<span class="hard">HARD</span>' : ''}Q：${esc(x.q)}</p><p class="a">A：${esc(x.a)}</p>`).join('')}</div>
      </details>`;
    return `<section class="person"><div class="phead"><h2><span>${'①②③④'[idx - 1]}</span>${p.name}｜${p.slides}</h2>
      <div class="meta">${esc(p.part)}・全文約 ${p.mins[0]} 分、刪掉可省略句約 ${p.mins[1]} 分（每分鐘 250 字）</div></div>${pages}${extra}</section>`;
  }).join('') + '<p class="foot">數字皆對過回測結果檔；上台請照講，不要自己改數字。課程作業用途，非投資建議。</p>';
}
document.getElementById('thumb').onchange = render;
document.getElementById('hideopt').onchange = render;
const setFs = v => { fs = Math.max(14, Math.min(26, v)); document.documentElement.style.setProperty('--fs', fs + 'px'); store.set('fs', fs); };
document.getElementById('minus').onclick = () => setFs(fs - 1);
document.getElementById('plus').onclick = () => setFs(fs + 1);
setFs(fs); render();
</script>
</body>
</html>
